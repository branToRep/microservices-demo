# -----------------------------------------------------------------------------
# Construye nuestras dos imagenes y las publica en GHCR.
#
# Este flujo NO despliega: solo publica. El despliegue a EKS llega en la v2.0.0.
# La separacion es deliberada — publicar es seguro y repetible, desplegar cambia
# lo que la gente ve.
#
# Tu portatil no interviene. Y el runner de GitHub es amd64, igual que los nodos
# t3.medium, asi que no hace falta emulacion: construir en un Mac (arm64) daba
# imagenes que arrancan en local y fallan en el cluster con "exec format error",
# un mensaje que no menciona la arquitectura por ningun lado.
#
# QUE PUBLICA
#   ghcr.io/<duenio>/frontend:<sha>         y :main
#   ghcr.io/<duenio>/wishlistservice:<sha>  y :main
#
# La etiqueta con el SHA del commit es la que importa: identifica exactamente que
# codigo corre y permite volver atras. La etiqueta :main es comodidad para mirar.
#
# NO necesita ningun secreto. El GITHUB_TOKEN que GitHub genera para cada
# ejecucion basta, con el permiso `packages: write` de abajo.
# -----------------------------------------------------------------------------
name: Publicar imagenes

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'src/wishlistservice/**'
      - 'protos/**'
      - '.github/workflows/publicar-imagenes.yml'
  workflow_dispatch:

concurrency:
  group: publicar-imagenes-${{ github.ref }}
  cancel-in-progress: false   # no cancelar una publicacion a medias

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # si una imagen falla, la otra se publica igual
      matrix:
        servicio: [frontend, wishlistservice]

    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre del propietario en minusculas. branToRep -> brantorep
      - id: ctx
        run: |
          echo "duenio=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)"   >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.servicio }}
          # Solo amd64. Anadir arm64 doblaria el tiempo para una arquitectura
          # que ningun nodo del cluster usa.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.ctx.outputs.duenio }}/${{ matrix.servicio }}:${{ steps.ctx.outputs.sha }}
            ghcr.io/${{ steps.ctx.outputs.duenio }}/${{ matrix.servicio }}:main
          # La cache de GitHub Actions evita reconstruir dependencias que no
          # cambiaron. Sin ella cada push recompila todo el modulo de Go.
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,scope=${{ matrix.servicio }},mode=max

      - name: Resumen
        run: |
          {
            echo "### ${{ matrix.servicio }}"
            echo
            echo 'Publicada. Para desplegar esta version exacta:'
            echo
            echo '```bash'
            echo "kubectl set image deployment/${{ matrix.servicio }} \\"
            echo "  server=ghcr.io/${{ steps.ctx.outputs.duenio }}/${{ matrix.servicio }}:${{ steps.ctx.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
