{{ define "login" }}
{{ template "header" . }}
<div {{ with $.platform_css }} class="{{.}}" {{ end }}>
    <span class="platform-flag">
        {{$.platform_name}}
    </span>
</div>
<main role="main" class="cart-sections">
    <section class="container">
        <div class="row">
            <div class="col-lg-6 offset-lg-3 cart-summary-section">
                <div class="row mb-3 py-2">
                    <div class="col pl-md-0">
                        <h3>Entrar</h3>
                    </div>
                </div>
                {{ with $.error }}
                <div class="alert alert-danger" role="alert">{{ . }}</div>
                {{ end }}
                <form method="POST" action="{{ $.baseUrl }}/login">
                    <input type="hidden" name="csrf_token" value="{{ $.csrf_token }}">
                    <div class="form-group">
                        <label for="email">Correo</label>
                        <input type="email" id="email" name="email" class="form-control"
                               value="{{ $.email }}" required autocomplete="username" autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control"
                               required autocomplete="current-password">
                    </div>
                    <button type="submit" class="cymbal-button-primary">Entrar</button>
                </form>
                <p class="mt-4">¿No tienes cuenta? <a href="{{ $.baseUrl }}/register">Crea una</a>.</p>
            </div>
        </div>
    </section>
</main>

{{ template "footer" . }}
{{ end }}
