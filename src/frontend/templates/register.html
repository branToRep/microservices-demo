{{ define "register" }}
{{ template "header" . }}
<div {{ with $.platform_css }} class="{{.}}" {{ end }}>
    <span class="platform-flag">
        {{$.platform_name}}
    </span>
</div>
<main role="main" class="cart-sections">
    <section class="container">
        <div class="row">
            <div class="col-lg-6 offset-lg-3 cart-summary-section">
                <div class="row mb-3 py-2">
                    <div class="col pl-md-0">
                        <h3>Crear una cuenta</h3>
                    </div>
                </div>
                {{ with $.error }}
                <div class="alert alert-danger" role="alert">{{ . }}</div>
                {{ end }}
                <form method="POST" action="{{ $.baseUrl }}/register">
                    <input type="hidden" name="csrf_token" value="{{ $.csrf_token }}">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="first_name">Nombre</label>
                            <input type="text" id="first_name" name="first_name" class="form-control"
                                   value="{{ $.first_name }}" maxlength="100" autocomplete="given-name">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="last_name">Apellido</label>
                            <input type="text" id="last_name" name="last_name" class="form-control"
                                   value="{{ $.last_name }}" maxlength="100" autocomplete="family-name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo</label>
                        <input type="email" id="email" name="email" class="form-control"
                               value="{{ $.email }}" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control"
                               required minlength="8" maxlength="72" autocomplete="new-password">
                        <small class="form-text text-muted">Entre 8 y 72 caracteres.</small>
                    </div>
                    <div class="form-group">
                        <label for="password_confirm">Repite la contraseña</label>
                        <input type="password" id="password_confirm" name="password_confirm" class="form-control"
                               required minlength="8" maxlength="72" autocomplete="new-password">
                    </div>
                    <button type="submit" class="cymbal-button-primary">Crear cuenta</button>
                </form>
                <p class="mt-4">¿Ya tienes cuenta? <a href="{{ $.baseUrl }}/login">Entra</a>.</p>
            </div>
        </div>
    </section>
</main>

{{ template "footer" . }}
{{ end }}
