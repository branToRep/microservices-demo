{{/*
---------------------------------------------------------------------------
Los diez servicios de forma identica, generados desde .Values.servicios.

Esta plantilla ES el argumento para usar Helm en este proyecto. Con Kustomize
eran diez archivos de unas noventa lineas cada uno, casi iguales, y cambiar algo
comun (una etiqueta, un limite, la politica de descarga) significaba editar los
diez. Aqui se edita una vez.
---------------------------------------------------------------------------
*/}}
{{- range $s := .Values.servicios }}
{{- /* Un servicio que necesita la base no se despliega sin ella: arrancaria con
       el DATABASE_URL por defecto de su codigo (localhost) y entraria en ciclo
       de reinicios. Esto es lo que mantiene coherente el modo "cluster sin
       Vault" (vault.activa=false, postgres.activa=false), que es como se
       desplegaba antes de la 2.10.0. */}}
{{- if include "boutique.servicioOmitido" (dict "raiz" $ "servicio" $s) }}
{{- continue }}
{{- end }}
{{- $ctx := dict "raiz" $ "servicio" $s "nombre" $s.nombre }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $s.nombre }}
  labels:
    app: {{ $s.nombre }}
    {{- include "boutique.etiquetas" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ $s.nombre }}
  template:
    metadata:
      labels:
        app: {{ $s.nombre }}
    spec:
      serviceAccountName: {{ $s.nombre }}
      terminationGracePeriodSeconds: 5
      securityContext:
        {{- toYaml $.Values.seguridad.pod | nindent 8 }}
      containers:
        - name: server
          image: {{ include "boutique.imagen" $ctx }}
          {{- if $s.propia }}
          imagePullPolicy: Always
          {{- end }}
          securityContext:
            {{- toYaml $.Values.seguridad.contenedor | nindent 12 }}
          ports:
            - containerPort: {{ $s.puerto }}
          {{- /* Las variables que salen de un Secret van PRIMERO, y no es
               estetica: Kubernetes solo sustituye $(VARIABLE) si esa variable
               aparece ANTES en la lista. Las de 'env' salen de un mapa, que
               Helm recorre en orden alfabetico, asi que su posicion no se
               puede elegir ni predecir.

               Sin Vault no existen esos Secret, asi que no se referencian: con
               vault.activa=false esta plantilla produce lo mismo que antes de
               que hubiera secretos. */}}
          {{- $desdeSecreto := list }}
          {{- $addrConContrasena := false }}
          {{- if $.Values.vault.activa }}
          {{- $desdeSecreto = $s.desdeSecreto | default (list) }}
          {{- $addrConContrasena = $s.redisAddrConContrasena | default false }}
          {{- end }}
          {{- $conPostgres := and $s.usaPostgres $.Values.postgres.activa }}
          {{- if or $s.env $desdeSecreto $conPostgres }}
          env:
            {{- range $ref := $desdeSecreto }}
            - name: {{ $ref.variable }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secreto }}
                  key: {{ $ref.clave }}
            {{- end }}
            {{- if $conPostgres }}
            - name: DATABASE_URL
              value: {{ include "boutique.urlPostgres" $ | quote }}
            {{- end }}
            {{- range $k, $v := $s.env }}
            - name: {{ $k }}
              {{- if and $addrConContrasena (eq $k "REDIS_ADDR") }}
              {{- /* La peculiaridad de cartservice: StackExchange.Redis acepta
                     la contrasena dentro de la cadena de conexion, asi que no
                     necesito cambios de codigo (ADR 0019). El userservice no
                     entra aqui: su cliente lee REDIS_PASSWORD aparte. */}}
              value: {{ printf "%s,password=$(REDIS_PASSWORD)" $v | quote }}
              {{- else }}
              value: {{ $v | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $s.cpu }}
              memory: {{ $s.memoria }}
            limits:
              cpu: {{ $s.cpuMax }}
              memory: {{ $s.memoriaMax }}
          {{/* Todos registran grpc.health.v1, asi que la forma de la sonda es
               la misma; los TIEMPOS no. Vienen de values.yaml, servicio por
               servicio, tal como estaban en los manifiestos.

               Homogeneizarlos fue un error que cazo la comparacion contra los
               manifiestos: cuatro servicios no tenian initialDelaySeconds y les
               puse 20, y tres tenian periodSeconds 5 y les puse 15. No rompia
               nada, pero un chart debe reproducir lo que funciona. */}}
          readinessProbe:
            {{- with $s.sondaLectura }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            grpc:
              port: {{ $s.puerto }}
          livenessProbe:
            {{- with $s.sondaVida }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            grpc:
              port: {{ $s.puerto }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $s.nombre }}
  labels:
    app: {{ $s.nombre }}
    {{- include "boutique.etiquetas" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $s.nombre }}
  ports:
    - name: grpc
      {{/* El puerto del Service NO siempre es el del contenedor: emailservice
           expone 5000 y escucha en 8080, y checkoutservice lo busca en
           emailservice:5000. Asumir que coinciden rompia esa llamada. */}}
      port: {{ $s.puertoServicio | default $s.puerto }}
      targetPort: {{ $s.puerto }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $s.nombre }}
  labels:
    {{- include "boutique.etiquetas" $ctx | nindent 4 }}
{{- end }}
