# -----------------------------------------------------------------------------
# Valores del chart.
#
# Lo que se cambia al desplegar es 'imagenes.etiqueta', que el pipeline pasa con
# --set: es el SHA del commit, y es lo que permite saber que version corre.
# -----------------------------------------------------------------------------

imagenes:
  # Nuestras dos imagenes. Las publica .github/workflows/publicar-y-desplegar.yml
  nuestro:
    registro: ghcr.io/brantorep
    etiqueta: main
  # Las diez de Google. No las construimos: no hemos tocado ese codigo.
  google:
    registro: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo
    etiqueta: v0.10.6

# Se aplica a todos los contenedores. runAsNonRoot y readOnlyRootFilesystem
# vienen de los manifiestos de Google; no se relajan.
seguridad:
  pod:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
  contenedor:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# -----------------------------------------------------------------------------
# Los diez servicios de forma identica: Deployment + Service ClusterIP +
# ServiceAccount, contenedor "server", sonda gRPC en su propio puerto.
#
# Esta lista ES el motivo de usar Helm. Con Kustomize eran diez archivos casi
# iguales; aqui son diez entradas y una plantilla.
#
#   propia: true  -> la imagen sale de imagenes.nuestro
# -----------------------------------------------------------------------------
servicios:
  - nombre: adservice
    puerto: 9555
    puertoServicio: 9555
    sondaLectura: {initialDelaySeconds: 20, periodSeconds: 15}
    sondaVida: {initialDelaySeconds: 20, periodSeconds: 15}
    cpu: 200m
    memoria: 180Mi
    cpuMax: 300m
    memoriaMax: 300Mi
    env:
      PORT: "9555"

  - nombre: cartservice
    puerto: 7070
    sondaLectura: {initialDelaySeconds: 15}
    sondaVida: {initialDelaySeconds: 15, periodSeconds: 10}
    cpu: 200m
    memoria: 64Mi
    cpuMax: 300m
    memoriaMax: 128Mi
    # StackExchange.Redis acepta la contrasena dentro de la propia cadena de
    # conexion, asi que cartservice no necesito cambios de codigo (ADR 0019).
    # Es la UNICA entrada con esta peculiaridad: los demas leen REDIS_PASSWORD
    # como variable aparte.
    redisAddrConContrasena: true
    desdeSecreto:
      - variable: REDIS_PASSWORD
        secreto: redis-cart
        clave: password
    env:
      REDIS_ADDR: "redis-cart:6379"

  - nombre: checkoutservice
    puerto: 5050
    sondaLectura: {}
    sondaVida: {}
    cpu: 100m
    memoria: 64Mi
    cpuMax: 200m
    memoriaMax: 128Mi
    env:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      EMAIL_SERVICE_ADDR: "emailservice:5000"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"

  - nombre: currencyservice
    puerto: 7000
    sondaLectura: {}
    sondaVida: {}
    cpu: 100m
    memoria: 64Mi
    cpuMax: 200m
    memoriaMax: 128Mi
    env:
      PORT: "7000"
      DISABLE_PROFILER: "1"

  - nombre: emailservice
    puerto: 8080
    puertoServicio: 5000
    sondaLectura: {periodSeconds: 5}
    sondaVida: {periodSeconds: 5}
    cpu: 100m
    memoria: 64Mi
    cpuMax: 200m
    memoriaMax: 128Mi
    env:
      PORT: "8080"
      DISABLE_PROFILER: "1"

  - nombre: paymentservice
    puerto: 50051
    sondaLectura: {}
    sondaVida: {}
    cpu: 100m
    memoria: 64Mi
    cpuMax: 200m
    memoriaMax: 128Mi
    env:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  - nombre: productcatalogservice
    puerto: 3550
    sondaLectura: {}
    sondaVida: {}
    cpu: 100m
    memoria: 64Mi
    cpuMax: 200m
    memoriaMax: 128Mi
    env:
      PORT: "3550"
      DISABLE_PROFILER: "1"

  - nombre: recommendationservice
    puerto: 8080
    sondaLectura: {periodSeconds: 5}
    sondaVida: {periodSeconds: 5}
    cpu: 100m
    memoria: 220Mi
    cpuMax: 200m
    memoriaMax: 450Mi
    env:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      DISABLE_PROFILER: "1"

  - nombre: shippingservice
    puerto: 50051
    sondaLectura: {periodSeconds: 5}
    sondaVida: {}
    cpu: 100m
    memoria: 64Mi
    cpuMax: 200m
    memoriaMax: 128Mi
    env:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  - nombre: wishlistservice
    propia: true            # <- nuestra, va a imagenes.nuestro
    puerto: 8080
    sondaLectura: {initialDelaySeconds: 5}
    sondaVida: {initialDelaySeconds: 10, periodSeconds: 10}
    cpu: 50m
    memoria: 32Mi
    cpuMax: 200m
    memoriaMax: 128Mi
    env:
      PORT: "8080"
      REDIS_ADDR: "redis-wishlist:6379"
      WISHLIST_TTL_SECONDS: "172800"

  - nombre: userservice
    propia: true
    puerto: 8080
    sondaLectura: {initialDelaySeconds: 10, periodSeconds: 5}
    # 75 s y no 10 como los demas, y es a proposito: al arrancar espera a
    # Postgres (DB_INTENTOS x DB_ESPERA = 30 x 2 s = hasta 60 s) ANTES de abrir
    # el puerto. Con el valor de los demas, la sonda de vida lo mataria durante
    # esa espera y el pod entraria en ciclo de reinicios con Postgres sano.
    sondaVida: {initialDelaySeconds: 75, periodSeconds: 10}
    cpu: 100m
    memoria: 64Mi
    cpuMax: 200m
    memoriaMax: 128Mi
    desdeSecreto:
      - variable: POSTGRES_PASSWORD
        secreto: postgres
        clave: password
      - variable: REDIS_PASSWORD
        secreto: redis-sessions
        clave: password
    # Le anade DATABASE_URL, armada por el ayudante boutique.urlPostgres desde
    # el bloque 'postgres' de abajo. No esta escrita aqui porque values.yaml no
    # es una plantilla: no se puede meter un valor en medio de una cadena, y
    # tenerla en un solo sitio es lo que impide que el servicio y el Job de
    # migracion apunten a bases distintas.
    usaPostgres: true
    env:
      PORT: "8080"
      REDIS_ADDR: "redis-sessions:6379"

# -----------------------------------------------------------------------------
# Los dos Redis. Sin volumen persistente a proposito: el carrito y las listas
# son datos de demostracion, y las listas caducan a las 48 h de todos modos.
# -----------------------------------------------------------------------------
# 'contrasena' = de que Secret saca la que exige al arrancar (--requirepass).
# Sin ella, el Redis no pide nada: redis-wishlist sigue asi a proposito, las
# listas de deseos no son material de autenticacion.
redis:
  - nombre: redis-cart
    contrasena: {secreto: redis-cart, clave: password}
    memoria: 200Mi
    memoriaMax: 256Mi
  - nombre: redis-wishlist
    memoria: 100Mi
    memoriaMax: 200Mi
  # Las sesiones del userservice. Separado de redis-cart y CON contrasena: un
  # token de sesion es una credencial al portador, y mezclarlo con los carritos
  # daria a cartservice acceso a las sesiones de todo el mundo.
  - nombre: redis-sessions
    contrasena: {secreto: redis-sessions, clave: password}
    memoria: 100Mi
    memoriaMax: 200Mi

# -----------------------------------------------------------------------------
# La base del userservice.
#
# emptyDir, no PersistentVolumeClaim, y no es pereza: el cluster instala solo
# vpc-cni, coredns y kube-proxy (infra/aws/modules/cluster/main.tf), sin
# aws-ebs-csi-driver, asi que un PVC se quedaria en Pending sin un evento que
# diga por que. Y apagar.sh destruye el cluster al terminar cada sesion, asi que
# no hay nada que sobreviva de todos modos. Mismo criterio que los Redis.
# Ver el ADR 0023.
#
# El usuario y la base NO son secretos; la contrasena vive en Vault y llega por
# el Secret 'postgres'.
# -----------------------------------------------------------------------------
postgres:
  activa: true
  contrasena: {secreto: postgres, clave: password}
  # El usuario Unix con el que corre el contenedor, y HAY que fijarlo:
  #
  #   - La imagen oficial no trae instruccion USER: arranca como root y baja
  #     privilegios con gosu. Con runAsNonRoot (viene de seguridad.pod y no se
  #     relaja), Kubernetes rechazaria el pod antes de arrancarlo.
  #   - No vale el 1000 del resto del chart: initdb exige que el usuario EXISTA
  #     en /etc/passwd de la imagen, y falla con "could not look up effective
  #     user ID 1000: user does not exist". Comprobado.
  #   - 70 es el uid/gid del usuario postgres en la variante Alpine, y lo dice
  #     el propio Dockerfile de la imagen ("70 is the standard uid/gid for
  #     postgres in Alpine"). Si algun dia se cambia a la variante Debian, ahi
  #     es 999, y este es el unico sitio que hay que tocar.
  usuarioUnix: 70
  grupoUnix: 70
  servicio: postgres
  puerto: 5432
  usuario: boutique
  base: boutique
  memoria: 128Mi
  memoriaMax: 512Mi
  cpu: 100m
  cpuMax: 500m

# -----------------------------------------------------------------------------
# Quien llena ese Secret: el Vault Secrets Operator (ADR 0020).
#
# El chart pone lo que es igual en cualquier cuenta: la ServiceAccount con la
# que el cluster entra a Vault, como entra (VaultAuth) y que lee
# (VaultStaticSecret). Lo que cambia de un operador a otro (la direccion de SU
# Vault y su CA) NO va aqui: es la VaultConnection que crea
# scripts/aws/conectar-operador-vault.sh. Asi el pipeline despliega con el mismo
# comando de siempre sin saber a que Vault apunta el cluster.
#
# Requiere el operador instalado en el cluster (lo instala levantar.sh): sin sus
# CRD, Helm rechaza estas plantillas.
# -----------------------------------------------------------------------------
vault:
  activa: true
  # La VaultConnection que crea conectar-operador-vault.sh, en este namespace.
  conexion: vault
  # Tienen que coincidir con el rol de Vault (ansible/roles/vault_config/defaults).
  metodo: eks
  rol: boutique
  cuentaServicio: lector-vault
  audiencia: vault
  # El motor KV v2, montado en secret/.
  motorKV: secret
  # Cada cuanto vuelve a leer. Si el valor cambio, actualiza el Secret y
  # reinicia los deployments que lo usan: rotar no exige redesplegar.
  refresco: 60s
  # Un VaultStaticSecret por entrada. Era una sola ruta hasta que hubo mas de un
  # secreto que leer; la lista es lo que evita copiar la plantilla.
  #
  #   ruta     relativa al motor KV. Tiene que estar en la politica
  #            boutique-lectura (ansible/roles/vault_config/files/politicas);
  #            si no, el operador recibe "permission denied" y el Secret no
  #            llega nunca.
  #   secreto  el Secret de Kubernetes que el operador crea y del que es dueno.
  #
  # A quien reiniciar cuando el valor rota NO se declara aqui: la plantilla lo
  # deduce de quien nombra ese Secret ('desdeSecreto' en servicios, 'contrasena'
  # en redis y en postgres). Es una decision de seguridad: si al servidor le
  # faltara su reinicio, rotar en Vault dejaria la contrasena vieja valida sin
  # avisar de nada. El razonamiento completo esta en templates/vault.yaml.
  secretos:
    - ruta: boutique/redis-cart
      secreto: redis-cart
    - ruta: boutique/redis-sessions
      secreto: redis-sessions
    - ruta: boutique/postgres
      secreto: postgres

# -----------------------------------------------------------------------------
# El frontend. Aparte porque su sonda es HTTP, no gRPC, y porque necesita un
# Service extra con NodePort FIJO: el balanceador que declara Terraform apunta
# a ese numero. Si cambia aqui, hay que cambiarlo en
# infra/aws/envs/dev/variables.tf, o el balanceador comprueba un puerto donde
# no escucha nadie.
# -----------------------------------------------------------------------------
frontend:
  puerto: 8080
  nodePort: 30080
  cpu: 100m
  memoria: 64Mi
  cpuMax: 200m
  memoriaMax: 128Mi
  env:
    PORT: "8080"
    PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
    CURRENCY_SERVICE_ADDR: "currencyservice:7000"
    CART_SERVICE_ADDR: "cartservice:7070"
    RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
    SHIPPING_SERVICE_ADDR: "shippingservice:50051"
    CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
    AD_SERVICE_ADDR: "adservice:9555"
    # Ese servicio NO se despliega, pero main.go la lee con mustMapEnv, que
    # entra en panico si falta. Quitarla impide que el frontend arranque.
    SHOPPING_ASSISTANT_SERVICE_ADDR: "shoppingassistantservice:80"
    WISHLIST_SERVICE_ADDR: "wishlistservice:8080"
    ENABLE_PROFILER: "0"

# -----------------------------------------------------------------------------
# Generador de carga. Apagado por defecto, igual que lo traia Google comentado
# en su kustomization. Encenderlo:  --set loadgenerator.activo=true
# -----------------------------------------------------------------------------
loadgenerator:
  activo: false
  usuarios: 10
  ritmo: 1
  cpu: 300m
  memoria: 256Mi
  cpuMax: 500m
  memoriaMax: 512Mi
