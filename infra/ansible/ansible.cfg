# -----------------------------------------------------------------------------
# Configuracion de Ansible para este repositorio. Se lee sola si se corre desde
# esta carpeta:
#
#   cd infra/ansible
#   ansible-playbook playbooks/vault.yml
#
# Las rutas relativas son relativas a ESTE archivo.
# -----------------------------------------------------------------------------
[defaults]
inventory = inventario/aws_ec2.yml
roles_path = roles
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# Por SSM no hay SSH, asi que tampoco huellas de host que comprobar.
host_key_checking = False
callback_result_format = yaml

[inventory]
enable_plugins = amazon.aws.aws_ec2
