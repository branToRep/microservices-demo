---
# -----------------------------------------------------------------------------
# Configura una Vault YA INICIALIZADA y DESELLADA, hablando con su API desde la
# maquina del operador (Paso 7 de la lamina). No entra en la maquina: todo va
# por HTTPS al 8200, verificando contra la CA propia.
#
# Cada paso pregunta primero como esta y solo cambia si hace falta, asi que la
# segunda corrida termina en changed=0 como el resto de Ansible.
# -----------------------------------------------------------------------------

- name: Comprobar que estan VAULT_ADDR, VAULT_CACERT y VAULT_TOKEN
  ansible.builtin.assert:
    that:
      - vault_config_addr | length > 0
      - vault_config_cacert | length > 0
      - vault_config_token | length > 0
    fail_msg: >-
      Faltan VAULT_ADDR, VAULT_CACERT o un token (VAULT_TOKEN, o
      ~/.vault-token tras 'vault login'). Ver docs/OPERACION-VAULT.md.
    quiet: true

- name: Leer el estado del sello
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/seal-status"
    ca_path: "{{ vault_config_cacert }}"
  register: vault_config_sello
  check_mode: false

- name: Comprobar que Vault esta inicializada y desellada
  ansible.builtin.assert:
    that:
      - vault_config_sello.json.initialized
      - not vault_config_sello.json.sealed
    fail_msg: >-
      Vault {{ 'no esta inicializada' if not vault_config_sello.json.initialized
      else 'esta sellada' }}. Ver docs/OPERACION-VAULT.md.
    quiet: true

# --------------------------- registro de auditoria ---------------------------
# Lo primero, antes de crear nada: asi la propia creacion del secreto ya queda
# registrada. Vault escribe cada peticion (quien, que ruta, cuando) con los
# valores sensibles cifrados con HMAC: el registro no filtra los secretos.
- name: Leer los registros de auditoria activos
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/audit"
    ca_path: "{{ vault_config_cacert }}"
    headers:
      X-Vault-Token: "{{ vault_config_token }}"
  register: vault_config_auditorias
  check_mode: false

- name: Activar el registro de auditoria en archivo
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/audit/file"
    method: PUT
    ca_path: "{{ vault_config_cacert }}"
    headers:
      X-Vault-Token: "{{ vault_config_token }}"
    body_format: json
    body:
      type: file
      description: Cada peticion a Vault, con los valores sensibles en HMAC
      options:
        file_path: "{{ vault_config_archivo_auditoria }}"
    status_code: [200, 204]
  when: "'file/' not in (vault_config_auditorias.json.data | default(vault_config_auditorias.json))"
  changed_when: true

# --------------------------------- motor KV ----------------------------------
# KV version 2: guarda versiones de cada secreto. Cambiar la contrasena no
# destruye la anterior, y se puede volver atras o ver cuando cambio.
- name: Leer los motores de secretos montados
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/mounts"
    ca_path: "{{ vault_config_cacert }}"
    headers:
      X-Vault-Token: "{{ vault_config_token }}"
  register: vault_config_montajes
  check_mode: false

- name: Montar el motor KV v2
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/mounts/{{ vault_config_ruta_kv }}"
    method: POST
    ca_path: "{{ vault_config_cacert }}"
    headers:
      X-Vault-Token: "{{ vault_config_token }}"
    body_format: json
    body:
      type: kv
      description: Secretos de la boutique (ADR 0019)
      options:
        version: "2"
    status_code: [200, 204]
  when: (vault_config_ruta_kv ~ '/') not in (vault_config_montajes.json.data | default(vault_config_montajes.json))
  changed_when: true

# -------------------------- las contrasenas generadas ------------------------
# Se generan aqui y se escriben directamente en Vault: no pasan por ningun
# archivo, ni se imprimen. Si la ruta ya existe, NO se toca: rotar una
# contrasena es una decision, no un efecto de volver a correr el playbook.
#
# La lista esta en defaults (vault_config_secretos), con el porque del juego de
# caracteres. Agregar un secreto generado es agregar una linea alli, aqui nada.
- name: Comprobar que contrasenas generadas ya existen
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/{{ vault_config_ruta_kv }}/data/{{ item }}"
    ca_path: "{{ vault_config_cacert }}"
    headers:
      X-Vault-Token: "{{ vault_config_token }}"
    status_code: [200, 404]
  loop: "{{ vault_config_secretos }}"
  register: vault_config_generados
  check_mode: false
  no_log: true   # la respuesta trae la contrasena si existe

# item.item es la ruta; item.status, lo que contesto la comprobacion de arriba.
- name: Crear las contrasenas que falten
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/{{ vault_config_ruta_kv }}/data/{{ item.item }}"
    method: POST
    ca_path: "{{ vault_config_cacert }}"
    headers:
      X-Vault-Token: "{{ vault_config_token }}"
    body_format: json
    body:
      data:
        password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
    status_code: [200, 204]
  loop: "{{ vault_config_generados.results }}"
  when: item.status == 404
  changed_when: true
  no_log: true   # el cuerpo lleva la contrasena

# ------------------------- politicas y acceso personal -----------------------
- name: Politicas ACL
  ansible.builtin.import_tasks: politicas.yml

- name: El metodo jwt del cluster
  ansible.builtin.import_tasks: jwt.yml

- name: Acceso personal con usuario y contrasena
  ansible.builtin.include_tasks: usuarios.yml
  when: vault_config_usuario | length > 0

- name: Resumen
  ansible.builtin.debug:
    msg: >-
      Auditoria en {{ vault_config_archivo_auditoria }}, KV v2 en
      {{ vault_config_ruta_kv }}/.
      Contrasenas generadas: {{ vault_config_secretos | join(', ') }}
      (nuevas en esta corrida:
      {{ vault_config_generados.results | selectattr('status', 'equalto', 404)
         | map(attribute='item') | list | join(', ') | default('ninguna', true) }}).
      Politicas: {{ vault_config_politicas | join(', ') }}.
      Metodo jwt en auth/{{ vault_config_jwt_ruta }}/ con el rol {{ vault_config_jwt_rol }}
      (el emisor del cluster lo escribe scripts/aws/avisar-a-vault.sh).
      {{ ('Usuario ' ~ vault_config_usuario ~ (' (ya existia).' if vault_config_usuario_actual.status == 200 else ' (creado ahora).'))
         if vault_config_usuario | length > 0 else 'Usuarios: sin cambios (VAULT_USUARIO vacio).' }}
