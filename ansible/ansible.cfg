# -----------------------------------------------------------------------------
# Configuracion de Ansible para este repositorio.
#
# Ansible solo lee el ansible.cfg del directorio ACTUAL, asi que todo se corre
# desde aqui:
#
#   cd ansible
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml
# -----------------------------------------------------------------------------
[defaults]
inventory = inventario.yml
roles_path = roles
# Las colecciones van FUERA del repositorio, en el sitio por defecto de Ansible.
# Dentro, ansible-lint recorria sus miles de archivos; en WSL sobre /mnt/c eso
# convertia segundos en minutos.
collections_path = ~/.ansible/collections

# Python de la maquina: el que traiga Ubuntu, sin aviso en cada corrida.
interpreter_python = auto_silent

# Salida legible en YAML. Los logs de Ansible son evidencia del portafolio, y
# una salida en JSON de una linea no se puede leer en una captura.
callback_result_format = yaml

# Sin archivos .retry tirados por el repositorio.
retry_files_enabled = false

[ssh_connection]
# Manda los modulos por la misma conexion en vez de copiarlos a /tmp primero.
# Con el tunel SSM, cada viaje cuesta: esto divide el tiempo de una corrida.
pipelining = true
