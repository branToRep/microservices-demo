# -----------------------------------------------------------------------------
# ESTO YA NO ES EL CAMINO DE DESPLIEGUE.
#
# Desde la v2.2.0 la tienda se despliega con el chart de charts/boutique:
#
#     helm upgrade --install boutique charts/boutique
#
# Estos manifiestos se conservan porque son la referencia legible y la que se
# puede comparar con el repositorio de Google (git diff contra upstream). El
# chart se verifico generando exactamente los mismos 38 objetos.
#
# 'wishlistservice.yaml' se quito de la lista a proposito: con el dentro,
# 'kubectl apply -k' desplegaria medio proyecto con la imagen equivocada y sin
# que Helm se enterara.
# -----------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
 - adservice.yaml
 - cartservice.yaml
 - checkoutservice.yaml
 - currencyservice.yaml
 - emailservice.yaml
 - frontend.yaml
# - loadgenerator.yaml # During development, the loadgenerator module inside skaffold.yaml will be used.
 - paymentservice.yaml
 - productcatalogservice.yaml
 - recommendationservice.yaml
 - shippingservice.yaml
