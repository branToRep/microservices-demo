apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          # TEMPORAL (opcion A): imagen publica de Google, SIN nuestras listas
          # de deseos ni cuentas. Sirve para comprobar que el cluster, la red y
          # el balanceador funcionan. Se sustituye por la nuestra cuando este
          # publicada en GHCR o ECR. Ver el ticket de publicar imagenes.
          # Nuestra imagen, no la publica de Google. Es lo que hace que la
          # tienda muestre las listas de deseos.
          #
          # Va :main y no un SHA a proposito: es el suelo para un despliegue
          # desde cero. El trabajo "desplegar" de publicar-y-desplegar.yml
          # apunta al SHA exacto con "kubectl set image".
          image: ghcr.io/brantorep/frontend:main
          imagePullPolicy: Always
          ports:
          - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-liveness-probe"
          env:
          - name: PORT
            value: "8080"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "productcatalogservice:3550"
          - name: CURRENCY_SERVICE_ADDR
            value: "currencyservice:7000"
          - name: CART_SERVICE_ADDR
            value: "cartservice:7070"
          - name: RECOMMENDATION_SERVICE_ADDR
            value: "recommendationservice:8080"
          - name: SHIPPING_SERVICE_ADDR
            value: "shippingservice:50051"
          - name: CHECKOUT_SERVICE_ADDR
            value: "checkoutservice:5050"
          - name: AD_SERVICE_ADDR
            value: "adservice:9555"
          - name: SHOPPING_ASSISTANT_SERVICE_ADDR
            value: "shoppingassistantservice:80"
          # El codigo tiene este mismo valor por defecto, pero declararlo aqui
          # hace visible la dependencia: quien lea el manifiesto ve que el
          # frontend habla con el wishlistservice.
          - name: WISHLIST_SERVICE_ADDR
            value: "wishlistservice:8080"
          # # ENV_PLATFORM: One of: local, gcp, aws, azure, onprem, alibaba
          # # When not set, defaults to "local" unless running in GKE, otherwies auto-sets to gcp
          # - name: ENV_PLATFORM
          #   value: "aws"
          - name: ENABLE_PROFILER
            value: "0"
          # - name: CYMBAL_BRANDING
          #   value: "true"
          # - name: ENABLE_ASSISTANT
          #   value: "true"
          # - name: FRONTEND_MESSAGE
          #   value: "Replace this with a message you want to display on all pages."
          # As part of an optional Google Cloud demo, you can run an optional microservice called the "packaging service".
          # - name: PACKAGING_SERVICE_URL
          #   value: "" # This value would look like "http://123.123.123"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  labels:
    app: frontend
spec:
  # NodePort y NO LoadBalancer: en este laboratorio el controlador de la nube no
  # tiene permisos para gestionar balanceadores (los crea una vez y luego no
  # puede ni actualizarlos ni borrarlos). El ELB lo declara Terraform, en
  # infra/aws/modules/balanceador.
  type: NodePort
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    # PUERTO FIJO. Tiene que coincidir con la variable nodeport_frontend de
    # Terraform. Si cambia uno, el balanceador comprueba un puerto vacio.
    nodePort: 30080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
